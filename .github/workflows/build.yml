name: Build Windows app

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Build the Windows installer
        run: npm run dist

      - name: Publish a release people can download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/Friendcord-Setup.exe --title "Friendcord for Windows" --notes "Download Friendcord-Setup.exe, run it, then sign in with your Friendcord account." --latest
